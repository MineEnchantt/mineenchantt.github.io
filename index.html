<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineHub - منصة سكنات ماينكرافت</title>
  <!-- Tailwind CSS للتصميم -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- مكتبة skinview3d لعرض السكنات 3D -->
  <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">

  <!-- الهيدر / القائمة العلوية -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center px-6">
    <div class="flex items-center gap-2">
      <span class="text-3xl font-extrabold text-green-500 tracking-wider">MINE<span class="text-white">HUB</span></span>
    </div>
    
    <div id="auth-buttons" class="flex gap-3">
      <button onclick="openModal('login-modal')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-bold transition">تسجيل الدخول</button>
      <button onclick="openModal('signup-modal')" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-bold transition">حساب جديد</button>
    </div>

    <div id="user-profile" class="hidden flex items-center gap-4">
      <span id="user-email" class="text-gray-300 font-semibold"></span>
      <button onclick="openModal('upload-modal')" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded-lg font-bold transition">+ نشر سكن</button>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-500 px-3 py-2 rounded-lg text-sm font-bold transition">خروج</button>
    </div>
  </header>

  <!-- القسم الرئيسي -->
  <main class="flex-1 container mx-auto p-6">
    <div class="text-center my-8">
      <h1 class="text-4xl font-black mb-2">مرحباً بك في <span class="text-green-500">MineHub</span></h1>
      <p class="text-gray-400">استكشف وشارك أفضل سكنات ماينكرافت مع المجتمعات</p>
    </div>

    <!-- شبكة السكنات (Skins Grid) -->
    <div id="skins-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- يتم تحميل السكنات هنا ديناميكياً -->
    </div>
  </main>

  <!-- النافذة المنبثقة: تسجيل الدخول -->
  <div id="login-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-xl w-full max-w-md relative border border-gray-700">
      <h2 class="text-2xl font-bold mb-4">تسجيل الدخول</h2>
      <input type="email" id="login-email" placeholder="البريد الإلكتروني" class="w-full bg-gray-700 p-3 rounded mb-3 outline-none focus:ring-2 focus:ring-green-500">
      <input type="password" id="login-pass" placeholder="كلمة المرور" class="w-full bg-gray-700 p-3 rounded mb-4 outline-none focus:ring-2 focus:ring-green-500">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('login-modal')" class="bg-gray-600 px-4 py-2 rounded">إلغاء</button>
        <button onclick="login()" class="bg-green-600 px-4 py-2 rounded font-bold">دخول</button>
      </div>
    </div>
  </div>

  <!-- النافذة المنبثقة: إنشاء حساب -->
  <div id="signup-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-xl w-full max-w-md relative border border-gray-700">
      <h2 class="text-2xl font-bold mb-4">إنشاء حساب جديد</h2>
      <input type="email" id="signup-email" placeholder="البريد الإلكتروني" class="w-full bg-gray-700 p-3 rounded mb-3 outline-none focus:ring-2 focus:ring-green-500">
      <input type="password" id="signup-pass" placeholder="كلمة المرور" class="w-full bg-gray-700 p-3 rounded mb-4 outline-none focus:ring-2 focus:ring-green-500">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('signup-modal')" class="bg-gray-600 px-4 py-2 rounded">إلغاء</button>
        <button onclick="signup()" class="bg-green-600 px-4 py-2 rounded font-bold">تسجيل</button>
      </div>
    </div>
  </div>

  <!-- النافذة المنبثقة: رفع سكن -->
  <div id="upload-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-6 rounded-xl w-full max-w-md relative border border-gray-700">
      <h2 class="text-2xl font-bold mb-4">نشر سكن جديد</h2>
      <input type="text" id="skin-title" placeholder="اسم السكن" class="w-full bg-gray-700 p-3 rounded mb-3 outline-none focus:ring-2 focus:ring-green-500">
      <label class="block mb-2 text-sm text-gray-400">اختر صورة السكن (.png):</label>
      <input type="file" id="skin-file" accept=".png" class="w-full bg-gray-700 p-2 rounded mb-4 text-sm">
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('upload-modal')" class="bg-gray-600 px-4 py-2 rounded">إلغاء</button>
        <button onclick="uploadSkin()" class="bg-green-600 px-4 py-2 rounded font-bold">نشر</button>
      </div>
    </div>
  </div>

  <!-- ملف البرمجة والخلفية -->
  <script type="module" src="app.js"></script>
</body>
</html>
